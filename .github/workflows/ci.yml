name: CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - prd
      - main
  push:
    branches:
      - dev
      - qa
      - prd
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  android:
    name: Android CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
          cache-provider: basic

      - name: Assemble debug build
        run: gradle :android:app:assembleDebug

