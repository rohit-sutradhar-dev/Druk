name: Deploy Backend

on:
  push:
    branches:
      - dev
      - qa
      - prd
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container app
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: backend
          dockerfilePath: Dockerfile
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/druk-api:${{ github.sha }}

